<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Meridian Gazette — Editor Simulation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Special+Elite&family=Oswald:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:      #111009;
    --surf:    #1c1914;
    --surf2:   #252018;
    --border:  #38312a;
    --text:    #ecdec6;
    --muted:   #7a6e5e;
    --paper:   #f3e7bd;
    --ink:     #191510;
    --red:     #bf1228;
    --gold:    #c9a03e;
    --blue:    #3568a0;
    --green:   #457a52;
    --purple:  #7054a0;
    --amber:   #b07a22;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Special Elite', serif;
    min-height: 100vh;
    line-height: 1.5;
  }

  /* ── TICKER ── */
  #ticker {
    background: var(--red);
    color: var(--paper);
    font-family: 'Oswald', sans-serif;
    font-size: 0.6rem;
    letter-spacing: 3px;
    text-transform: uppercase;
    padding: 4px 0;
    text-align: center;
    overflow: hidden;
    white-space: nowrap;
  }

  /* ── MASTHEAD ── */
  #masthead {
    background: var(--paper);
    color: var(--ink);
    padding: 10px 28px;
    border-bottom: 4px double var(--ink);
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 12px;
    position: sticky;
    top: 0;
    z-index: 90;
  }
  .paper-name {
    font-family: 'Playfair Display', serif;
    font-size: 2.4rem;
    font-weight: 900;
    letter-spacing: -1px;
    line-height: 1;
    color: var(--ink);
  }
  .paper-tagline {
    font-family: 'Oswald', sans-serif;
    font-size: 0.55rem;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #7a6050;
    margin-top: 3px;
  }
  .masthead-stats {
    display: flex;
    gap: 18px;
    align-items: flex-end;
  }
  .mstat { font-family: 'Oswald', sans-serif; text-align: center; }
  .mstat-label { font-size: 0.52rem; letter-spacing: 2px; text-transform: uppercase; color: #7a6050; display: block; }
  .mstat-value { font-size: 1rem; font-weight: 700; color: var(--ink); display: block; margin-top: 1px; }
  .masthead-week { font-family: 'Oswald', sans-serif; text-align: right; }
  .mw-label { font-size: 0.52rem; letter-spacing: 2px; text-transform: uppercase; color: #7a6050; }
  .mw-num { font-family: 'Playfair Display', serif; font-size: 1.5rem; font-weight: 900; color: var(--ink); line-height: 1; }
  .mw-date { font-family: 'Special Elite', serif; font-size: 0.65rem; color: #9a8060; }

  /* ── LAYOUT ── */
  #layout {
    display: grid;
    grid-template-columns: 200px 1fr;
    min-height: calc(100vh - 90px);
  }

  /* ── SIDEBAR ── */
  #sidebar {
    background: var(--surf);
    border-right: 1px solid var(--border);
    padding: 18px 14px;
    overflow-y: auto;
  }
  .sb-section { margin-bottom: 22px; }
  .sb-heading {
    font-family: 'Oswald', sans-serif;
    font-size: 0.58rem;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--muted);
    padding-bottom: 7px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 12px;
  }
  .metric { margin-bottom: 14px; }
  .metric-label {
    font-family: 'Oswald', sans-serif;
    font-size: 0.58rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 2px;
  }
  .metric-number {
    font-family: 'Oswald', sans-serif;
    font-size: 1.25rem;
    font-weight: 600;
    line-height: 1;
    color: var(--text);
  }
  .metric-bar { height: 3px; background: var(--border); border-radius: 2px; margin-top: 5px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 2px; transition: width 0.5s ease; }

  .win-cond {
    font-family: 'Oswald', sans-serif;
    font-size: 0.66rem;
    line-height: 1.9;
    color: var(--muted);
  }
  .win-cond .tick { margin-left: 4px; }
  .tick-yes { color: var(--green); }
  .tick-no  { color: var(--red); }

  .hist-entry {
    font-size: 0.66rem;
    line-height: 1.55;
    color: var(--muted);
    padding: 5px 0;
    border-bottom: 1px solid var(--border);
  }
  .hist-entry:last-child { border-bottom: none; }
  .hist-week { font-family: 'Oswald', sans-serif; font-size: 0.58rem; color: var(--gold); letter-spacing: 1px; display: block; }

  /* ── MAIN ── */
  #main { padding: 26px 34px; max-width: 740px; }

  /* ── INTRO ── */
  .intro-title {
    font-family: 'Playfair Display', serif;
    font-size: 3.2rem;
    font-weight: 900;
    color: var(--paper);
    line-height: 1;
  }
  .intro-italic {
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-size: 1rem;
    color: var(--muted);
    margin-top: 4px;
    margin-bottom: 10px;
  }
  .intro-rule { border: none; border-top: 3px double var(--gold); margin: 10px 0 18px; }
  .intro-body {
    font-size: 0.88rem;
    line-height: 1.85;
    color: var(--muted);
    max-width: 580px;
    margin-bottom: 22px;
  }
  .intro-body strong { color: var(--text); }
  .intro-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    max-width: 480px;
    margin-bottom: 24px;
  }
  .intro-stat {
    background: var(--surf);
    border: 1px solid var(--border);
    padding: 12px 14px;
    font-family: 'Oswald', sans-serif;
  }
  .ist-label { font-size: 0.56rem; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); display: block; }
  .ist-value { font-size: 1.15rem; font-weight: 600; color: var(--gold); display: block; margin-top: 3px; }
  .intro-rules {
    font-family: 'Oswald', sans-serif;
    font-size: 0.68rem;
    color: var(--muted);
    line-height: 1.8;
    margin-bottom: 22px;
    max-width: 540px;
  }
  .intro-rules strong { color: var(--text); }

  /* ── PHASE TAG ── */
  .phase-tag {
    font-family: 'Oswald', sans-serif;
    font-size: 0.58rem;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--red);
    margin-bottom: 5px;
    display: flex;
    align-items: center;
    gap: 7px;
  }
  .phase-dot {
    width: 7px; height: 7px;
    background: var(--red);
    border-radius: 50%;
    display: inline-block;
    animation: blink 1.1s infinite;
  }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.15} }
  .phase-headline {
    font-family: 'Playfair Display', serif;
    font-size: 1.75rem;
    font-weight: 700;
    color: var(--paper);
    line-height: 1.1;
    margin-bottom: 20px;
  }

  /* ── EVENT CARD ── */
  .event-card {
    background: var(--surf);
    border: 1px solid var(--border);
    border-left: 4px solid var(--red);
    padding: 20px 22px;
    margin-bottom: 20px;
    animation: slideIn 0.25s ease;
  }
  @keyframes slideIn { from{opacity:0;transform:translateY(-6px)} to{opacity:1;transform:translateY(0)} }
  .event-headline {
    font-family: 'Playfair Display', serif;
    font-size: 1.15rem;
    font-weight: 700;
    color: var(--paper);
    margin-bottom: 9px;
    line-height: 1.2;
  }
  .event-body { font-size: 0.82rem; color: var(--muted); line-height: 1.8; margin-bottom: 18px; }
  .choices { display: flex; flex-direction: column; gap: 8px; }

  .choice-btn {
    background: var(--surf2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 13px 15px;
    text-align: left;
    cursor: pointer;
    font-family: 'Special Elite', serif;
    font-size: 0.82rem;
    line-height: 1.5;
    transition: border-color 0.12s, background 0.12s;
    width: 100%;
  }
  .choice-btn:hover { border-color: var(--gold); background: #2e2618; }
  .choice-letter {
    font-family: 'Oswald', sans-serif;
    font-size: 0.56rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--gold);
    display: block;
    margin-bottom: 2px;
  }
  .choice-fx {
    font-family: 'Oswald', sans-serif;
    font-size: 0.66rem;
    color: var(--muted);
    margin-top: 5px;
    letter-spacing: 0.3px;
  }

  /* ── ALLOCATION ── */
  .alloc-hint {
    font-family: 'Oswald', sans-serif;
    font-size: 0.74rem;
    color: var(--muted);
    margin-bottom: 14px;
  }
  .alloc-hint strong { color: var(--gold); }

  .note-bar {
    border-left: 3px solid var(--gold);
    background: var(--surf);
    padding: 9px 13px;
    font-family: 'Oswald', sans-serif;
    font-size: 0.72rem;
    color: var(--muted);
    margin-bottom: 12px;
    line-height: 1.5;
    animation: slideIn 0.25s ease;
  }
  .note-bar.event-note { border-color: var(--red); }
  .note-label {
    font-size: 0.55rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    display: block;
    margin-bottom: 2px;
  }

  .alloc-rows { display: flex; flex-direction: column; gap: 7px; margin-bottom: 18px; }
  .alloc-row {
    background: var(--surf);
    border: 1px solid var(--border);
    padding: 13px 17px;
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: center;
    gap: 14px;
    transition: border-color 0.12s;
  }
  .alloc-row.active { border-color: var(--gold); }
  .cat-name {
    font-family: 'Playfair Display', serif;
    font-size: 0.95rem;
    font-weight: 700;
    color: var(--paper);
  }
  .cat-meta {
    font-family: 'Oswald', sans-serif;
    font-size: 0.6rem;
    color: var(--muted);
    margin-top: 2px;
    letter-spacing: 0.4px;
  }
  .pos { color: #5caa74; }
  .neg { color: #d05050; }

  .rctrl { display: flex; align-items: center; gap: 9px; }
  .cat-cost {
    font-family: 'Oswald', sans-serif;
    font-size: 0.68rem;
    min-width: 52px;
    text-align: right;
    color: var(--muted);
  }
  .cbtn {
    width: 26px; height: 26px;
    background: var(--surf2);
    border: 1px solid var(--border);
    color: var(--text);
    cursor: pointer;
    font-size: 1rem;
    display: flex; align-items: center; justify-content: center;
    transition: border-color 0.12s, color 0.12s;
    font-family: monospace;
    user-select: none;
  }
  .cbtn:hover:not(.disabled) { border-color: var(--gold); color: var(--gold); }
  .cbtn.disabled { opacity: 0.2; cursor: not-allowed; }
  .cval {
    font-family: 'Oswald', sans-serif;
    font-size: 1.1rem;
    font-weight: 600;
    color: var(--gold);
    min-width: 18px;
    text-align: center;
  }

  .cost-preview {
    font-family: 'Oswald', sans-serif;
    font-size: 0.7rem;
    color: var(--muted);
    border-top: 1px solid var(--border);
    padding-top: 11px;
    margin-bottom: 18px;
    line-height: 1.9;
    letter-spacing: 0.3px;
  }

  /* ── BUTTONS ── */
  .btn-primary {
    background: var(--red);
    color: var(--paper);
    border: none;
    padding: 12px 30px;
    font-family: 'Oswald', sans-serif;
    font-size: 0.88rem;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    cursor: pointer;
    transition: background 0.12s;
  }
  .btn-primary:hover:not(:disabled) { background: #9e0e22; }
  .btn-primary:disabled { opacity: 0.3; cursor: not-allowed; }

  .btn-secondary {
    background: var(--surf2);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 11px 26px;
    font-family: 'Oswald', sans-serif;
    font-size: 0.84rem;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    cursor: pointer;
    transition: border-color 0.12s, color 0.12s;
  }
  .btn-secondary:hover { border-color: var(--gold); color: var(--gold); }

  /* ── RESULTS ── */
  .results-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 18px; }
  .res-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 15px;
    background: var(--surf);
    border: 1px solid var(--border);
    font-family: 'Oswald', sans-serif;
    font-size: 0.8rem;
    animation: fadeUp 0.3s ease both;
  }
  @keyframes fadeUp { from{opacity:0;transform:translateY(4px)} to{opacity:1;transform:translateY(0)} }
  .res-row:nth-child(2){animation-delay:.06s}
  .res-row:nth-child(3){animation-delay:.12s}
  .res-row:nth-child(4){animation-delay:.18s}
  .res-row:nth-child(5){animation-delay:.24s}
  .res-row:nth-child(6){animation-delay:.30s}
  .res-row:nth-child(7){animation-delay:.36s}
  .res-delta { font-size: 0.92rem; font-weight: 600; }
  .res-row.churn-row { border-left: 2px solid var(--muted); }
  .res-row.budget-row { border-left: 2px solid var(--gold); }

  .res-summary {
    background: var(--surf2);
    border: 1px solid var(--border);
    padding: 14px 18px;
    margin-bottom: 22px;
    font-family: 'Oswald', sans-serif;
    font-size: 0.76rem;
    color: var(--muted);
    line-height: 1.75;
    animation: fadeUp 0.3s 0.42s ease both;
  }
  .res-summary strong { color: var(--text); }

  /* ── GAME OVER ── */
  .go-wrap { text-align: center; padding: 16px 0; }
  .go-banner {
    font-family: 'Oswald', sans-serif;
    font-size: 0.6rem;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--red);
    margin-bottom: 7px;
  }
  .go-headline {
    font-family: 'Playfair Display', serif;
    font-size: 2.1rem;
    font-weight: 900;
    color: var(--paper);
    line-height: 1.1;
    margin-bottom: 6px;
  }
  .go-sub {
    font-size: 0.86rem;
    color: var(--muted);
    line-height: 1.65;
    max-width: 520px;
    margin: 0 auto 22px;
  }
  .grade-big {
    font-family: 'Playfair Display', serif;
    font-size: 8.5rem;
    font-weight: 900;
    line-height: 1;
    margin: 4px 0 18px;
    animation: gradeReveal 0.5s ease;
  }
  @keyframes gradeReveal { from{opacity:0;transform:scale(0.7)} to{opacity:1;transform:scale(1)} }
  .go-stats {
    display: grid;
    grid-template-columns: repeat(3, 150px);
    gap: 10px;
    margin: 0 auto 26px;
    justify-content: center;
  }
  .go-stat {
    background: var(--surf);
    border: 1px solid var(--border);
    padding: 13px 14px;
    font-family: 'Oswald', sans-serif;
  }
  .go-stat-label { font-size: 0.56rem; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); }
  .go-stat-value { font-size: 1.4rem; font-weight: 600; color: var(--gold); display: block; margin-top: 3px; }
</style>
</head>
<body>

<div id="ticker">THE MERIDIAN GAZETTE — EDITOR SIMULATION — AUTUMN 1994 — INDEPENDENT PRESS</div>
<div id="masthead"></div>
<div id="layout">
  <div id="sidebar"></div>
  <div id="main"></div>
</div>

<script>
// ═══════════════════════════════════════════
// CONSTANTS
// ═══════════════════════════════════════════

const WEEKS_TOTAL = 10;
const WEEKLY_BASE_COST = 17000;
const WEEKLY_CHURN = 1100;
const WEEKLY_CRED_DRIFT = 1.1;

const CATS = [
  { id:'local',         name:'Local News',        desc:'Schools, council, planning',           cost:1500, circ:350,  cred:1,  max:4, col:'#3568a0' },
  { id:'politics',      name:'City Politics',      desc:'Mayor, elections, accountability',     cost:7500, circ:600,  cred:2,  max:4, col:'#7054a0' },
  { id:'crime',         name:'Crime & Courts',     desc:'Police, trials, criminal justice',     cost:5000, circ:800,  cred:-1, max:4, col:'#bf1228' },
  { id:'investigative', name:'Investigative',      desc:'Corruption, deep dives, accountability',cost:5000,circ:150,  cred:5,  max:4, col:'#c9a03e' },
  { id:'features',      name:'Human Interest',     desc:'Profiles, lifestyle, community',       cost:3500, circ:1200,  cred:-3, max:4, col:'#457a52' },
];

const EVENTS = [
  {
    id:'advertiser',
    headline:'MegaMart Threatens Ad Pullout',
    body:`MegaMart's PR director called this morning. If you run the piece on unsafe conditions at their Eastgate warehouse, they'll pull £22,000 in weekly advertising. Two sources on record. Photos secured. The story is solid.`,
    choices:[
      { label:'Run it', desc:'Public interest over revenue.', fx:{budget:-22000,credibility:15,circulation:1800}, fxt:'−£22k, improved circulation and reputation' },
      { label:'Kill the story', desc:'Protect the relationship.', fx:{credibility:-12}, fxt:'Lowered credibility' },
      { label:'Soften it', desc:'Publish a diluted version. Keep the advertiser.', fx:{budget:-6000,credibility:-8,circulation:500}, fxt:'−£6k, lowered reputation, increased circulation' },
    ]
  },
  {
    id:'source',
    headline:'Source Inside City Hall',
    body:`A clerk in the Mayor's office will hand over internal memos on the waterfront redevelopment — for £7,500 cash. Legally grey but not illegal. The documents could anchor a major accountability piece.`,
    choices:[
      { label:'Pay for the documents', desc:'Chequebook journalism. Story is worth it.', fx:{budget:-7500,investBonus:1.5}, fxt:'−£7,500. Investigative stories +50% this week.' },
      { label:'Decline', desc:"You don't pay sources.", fx:{}, fxt:'Do not pay the source' },
      { label:'Report without them', desc:'Thinner story, higher risk.', fx:{circulation:800,credibility:-9}, fxt:'Increased circulation, lower repuation' },
    ]
  },
  {
    id:'rival',
    headline:'The Tribune Is About To Break Your Story',
    body:`Your contact at the Tribune called: they're running the councillor corruption piece tonight — the same story your team has been building for six weeks. They will scoop you by morning.`,
    choices:[
      { label:'Rush it tonight', desc:'Publish now. Verification incomplete.', fx:{rushStory:true}, fxt:'50/50: either boosts readership AND credibility, or breaks down credibility.' },
      { label:'Let them have it', desc:'Your version runs next week, far better.', fx:{circulation:-2000,nextInvBonus:1.6}, fxt:'Lose readers to tribune, but next week\'s investigative +60%.' },
      { label:'Call their editor', desc:'Propose a joint 48-hour embargo.', fx:{credibility:3}, fxt:'Moderate credibility boost' },
    ]
  },
  {
    id:'diane',
    headline:'Senior Reporter Has an Offer',
    body:`Diane Kowalski, your best investigative reporter, has been approached by the Tribune. She'd stay for a £4,000 salary increase. Without her, your investigative unit loses its anchor.`,
    choices:[
      { label:"Match the offer", desc:'Ongoing cost. Diane stays. Unit intact.', fx:{budget:-4000,weeklyBudgetPenalty:900,investMultiplier:1.25}, fxt:'−£4k now. +£900/week ongoing. Investigative +25% permanent.' },
      { label:'Negotiate down', desc:'Counter at £2,000. She may or may not accept', fx:{dianeNegotiation:true}, fxt:'Either −£2k now. +£450/week ongoing, or Investigative stories −45% for rest of game.' },
      { label:'Let her go', desc:'Decline. She leaves. Major blow to investigations.', fx:{investMultiplier:0.55}, fxt:'Investigative stories −45% for rest of game.' },
    ]
  },
  {
    id:'libel',
    headline:'Libel Suit Incoming',
    body:`Solicitors for former Deputy Chief Hargreaves have written threatening action over last month's misconduct piece. Your lawyers say you'd probably win at trial — but probably isn't certainly, and legal costs aren't free.`,
    choices:[
      { label:'Settle out of court', desc:'Pay them. Case closed.', fx:{budget:-28000}, fxt:'−£28k' },
      { label:'Fight it', desc:'60% you win. 40% you pay double.', fx:{libelFight:true}, fxt:'60%: win and increase credibility. 40%: −£45k, lose credibility' },
      { label:'Print a retraction', desc:'Kills the suit. Damages your reputation.', fx:{credibility:-18}, fxt:'Drops credibility' },
    ]
  },
  {
    id:'cityaccess',
    headline:"Mayor's Office: Exclusive Access on Offer",
    body:`The Mayor's communications director called with an offer: exclusive embargoed briefings for three weeks in exchange for "balanced, fair coverage going forward." Not in writing, but the implication is unmistakable.`,
    choices:[
      { label:'Accept', desc:'Editorial independence for access.', fx:{credibility:-20,politicsBonus:1.5}, fxt:'Lowers credibility. City politics stories +50% this week.' },
      { label:'Decline', desc:'Independence intact.', fx:{credibility:5}, fxt:'Improves credibility' },
    ]
  },
  {
    id:'celeb',
    headline:'Local Sports Star Arrested',
    body:`United midfielder Jamie Pearce was arrested last night for drink-driving. It's tabloid bait — your readers will click. Your senior journalists will not be pleased. Your circulation figures will love it.`,
    choices:[
      { label:'Front-page splash', desc:'Lead with it. Circulation will spike.', fx:{circulation:5000,credibility:-20}, fxt:'Big boost to circulation, big hit on credibility' },
      { label:'Inside section, brief', desc:"Mention it. Don't sensationalise.", fx:{circulation:1500,credibility:-10}, fxt:'Moderate boost to circulation, moderate hit on credibility' },
      { label:"Don't cover it", desc:'Not your beat. Standards intact.', fx:{credibility:4}, fxt:'No boost to circulation, minor increase on credibility' },
    ]
  },
  {
    id:'correction',
    headline:"Significant Error in Last Week's Business Story",
    body:`Your business desk got a key figure badly wrong: the contractor's loss was £1.2 million, not £12 million. A rival columnist noticed. How you respond will define what the Gazette stands for.`,
    choices:[
      { label:'Prominent correction, page one', desc:'Own it fully.', fx:{credibility:7,circulation:-2500}, fxt:'Big boost in credibility, big drop in circulation' },
      { label:'Corrections column, page four', desc:'Standard procedure.', fx:{credibility:2,circulation:-500}, fxt:'Small boost in credibility, small drop in circulation' },
      { label:'Say nothing', desc:'Hope it blows over. 50% chance it does not.', fx:{silentCorrection:true}, fxt:'50% chance nothing happnes, 50% chance of fine. 50%: press watchdog column, Big drop in credibility.' },
    ]
  },
  {
    id:'syndication',
    headline:'AP Wants to Syndicate Your Investigation',
    body:`The Associated Press wants to syndicate your recent environmental investigation to 40 regional papers. Flat fee: £9,500. The Gazette's name — and your reporters' bylines — goes national.`,
    choices:[
      { label:'Syndicate it', desc:'Take the money and the exposure.', fx:{budget:9500,circulation:1000}, fxt:'+£9,500, increased circulation' },
      { label:'Keep it exclusive', desc:'The story belongs to your readers.', fx:{credibility:5}, fxt:'Boosts credibility' },
    ]
  },
  {
    id:'tip',
    headline:'Anonymous Tip: DA on the Payroll',
    body:`An anonymous call: the District Attorney is on the payroll of a property developer. No documents, no corroboration — just the caller's word. Your reporter believes it. Your solicitor would not.`,
    choices:[
      { label:'Publish now', desc:'High risk. Massive upside or catastrophic.', fx:{highRisk:true}, fxt:'40%: huge credibility and circulation boost 60%: huge credibility loss and major fine' },
      { label:'Investigate further', desc:'Hold the story. Build the case next week.', fx:{nextInvBonus:1.8}, fxt:"Next week's investigative stories get +80% boost." },
      { label:'Spike it', desc:"Unverified tips don't become stories.", fx:{}, fxt:'No effect.' },
    ]
  },
  {
    id:'buyout',
    headline:'Media Group Offers Acquisition',
    body:`Meridian Media Group wants 40% of the Gazette for £95,000. They'd leave editorial "independent" — but you'd attend quarterly board meetings, and their preferred advertisers would get preferential treatment.`,
    choices:[
      { label:'Accept', desc:'Cash infusion. Some strings attached.', fx:{budget:95000,credibility:-20,weeklyCredPenalty:3}, fxt:'+£95k, large negative credibility impact' },
      { label:'Decline', desc:'Independence is not for sale.', fx:{credibility:5}, fxt:'Improved credibility' },
    ]
  },
  {
    id:'fire',
    headline:'Warehouse Fire — Three Dead',
    body:`A fire at the Eastgate industrial estate. Three dead, twelve injured. It's the biggest local story in years. How hard do you push?`,
    choices:[
      { label:'All hands on deck', desc:'Pull 3 reporters from their assignments.', fx:{circulation:6000,credibility:5,reporterPenalty:3}, fxt:'Big increases in circulation and credibility. −3 reporters this week.' },
      { label:'Standard coverage', desc:'One reporter. Professional, not sensational.', fx:{circulation:2000,credibility:2,reporterPenalty:1}, fxt:'Moderate increases in circulation and credibility. −1 reporter this week.' },
      { label:'Wire copy only', desc:"Preserve your team's regular assignments.", fx:{circulation:500}, fxt:'Small circulation boost, keep all reporters' },
    ]
  },
];

// ═══════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════

let S = null;

function initState() {
  S = {
    phase: 'intro',
    week: 1,
    budget: 150000,
    circulation: 45000,
    credibility: 60,
    reportersBase: 8,
    reportersAvail: 8,
    alloc: { local:0, politics:0, crime:0, investigative:0, features:0 },
    curEvent: null,
    eventNote: null,
    // per-week modifiers (reset after publish)
    investBonus: 1.0,
    politicsBonus: 1.0,
    // carried to next week
    nextInvBonus: 1.0,
    // permanent
    investMultiplier: 1.0,
    weeklyBudgetPenalty: 0,
    weeklyCredPenalty: 0,
    usedEvIds: [],
    history: [],
    results: null,
    grade: '',
    won: false,
    gameOverReason: '',
  };
}

// ═══════════════════════════════════════════
// LOGIC
// ═══════════════════════════════════════════

function pickEvent() {
  const pool = EVENTS.filter(e => !S.usedEvIds.includes(e.id));
  const source = pool.length > 0 ? pool : EVENTS;
  return source[Math.floor(Math.random() * source.length)];
}

function applyEffect(fx) {
  let note = '';
  if (fx.budget)             S.budget += fx.budget;
  if (fx.circulation)        S.circulation = Math.max(0, S.circulation + fx.circulation);
  if (fx.credibility)        S.credibility = clamp(S.credibility + fx.credibility, 0, 100);
  if (fx.reporterPenalty)    S.reportersAvail = Math.max(0, S.reportersAvail - fx.reporterPenalty);
  if (fx.investBonus)        S.investBonus = fx.investBonus;
  if (fx.nextInvBonus)       S.nextInvBonus = fx.nextInvBonus;
  if (fx.politicsBonus)      S.politicsBonus = fx.politicsBonus;
  if (fx.investMultiplier)   S.investMultiplier = fx.investMultiplier;
  if (fx.weeklyBudgetPenalty) S.weeklyBudgetPenalty += fx.weeklyBudgetPenalty;
  if (fx.weeklyCredPenalty)  S.weeklyCredPenalty += fx.weeklyCredPenalty;

  if (fx.rushStory) {
    if (Math.random() < 0.5) {
      S.circulation += 4000; S.credibility = clamp(S.credibility + 10, 0, 100);
      note = 'You scooped the Tribune. +4,000 readers, +10 credibility.';
    } else {
      S.credibility = clamp(S.credibility - 15, 0, 100);
      note = 'Story ran with errors. Tribune corrected you publicly. −15 credibility.';
    }
  }
  if (fx.dianeNegotiation) {
    if (Math.random() < 0.5) {
      S.budget -= 45000; S.weeklyBudgetPenalty += 450;
      note = 'Diane accepts your offer. She stays, and the investigative unit is intact. -2k budget, -450 weekly budget moving forward.';
    } else {
      S.investMultiplier = 0.55;
      note = 'Diane goes to the Tribune. Major blow to your investigative unit. −45% on all investigative stories for the rest of the game.';
    }
  }
  if (fx.libelFight) {
    if (Math.random() < 0.60) {
      S.credibility = clamp(S.credibility + 10, 0, 100);
      note = 'Judge ruled in your favour. Hargreaves pays costs. +10 credibility.';
    } else {
      S.budget -= 45000; S.credibility = clamp(S.credibility - 20, 0, 100);
      note = 'You lost. Damages plus legal fees. −£45k, −20 credibility.';
    }
  }
  if (fx.silentCorrection) {
    if (Math.random() < 0.50) {
      note = 'The error went unnoticed. No further effect.';
    } else {
      S.credibility = clamp(S.credibility - 20, 0, 100);
      note = 'Press watchdog column ran a piece on the Gazette\'s standards. −20 credibility.';
    }
  }
  if (fx.highRisk) {
    if (Math.random() < 0.40) {
      S.credibility = clamp(S.credibility + 15, 0, 100); S.circulation += 5000;
      note = 'The DA story checked out. National coverage. +15 cred, +5,000 readers.';
    } else {
      S.credibility = clamp(S.credibility - 20, 0, 100); S.budget -= 35000;
      note = 'The tip was fabricated. Libel settlement and humiliation. −20 cred, −£35k.';
    }
  }
  return note;
}

function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

function calcResults() {
  const storyRows = [];
  let totalCircGain = 0, totalCredGain = 0, totalRepCost = 0;

  for (const cat of CATS) {
    const n = S.alloc[cat.id];
    if (!n) continue;
    const v = 0.8 + Math.random() * 0.4;
    let bonus = 1.0;
    if (cat.id === 'investigative') bonus = S.investBonus * S.investMultiplier;
    if (cat.id === 'politics')      bonus = S.politicsBonus;
    const circG = Math.round(cat.circ * n * v * bonus);
    const credG = parseFloat((cat.cred * n * v * bonus).toFixed(2));
    totalCircGain += circG;
    totalCredGain += credG;
    totalRepCost  += cat.cost * n;
    storyRows.push({ name:cat.name, n, circG, credG, cost:cat.cost*n });
  }

  const netCirc = Math.round(totalCircGain - WEEKLY_CHURN);
  const netCred = parseFloat((totalCredGain - WEEKLY_CRED_DRIFT - S.weeklyCredPenalty).toFixed(2));
  const revenue = Math.round(S.circulation * 0.38);
  const totalCost = WEEKLY_BASE_COST + totalRepCost + Math.round(S.weeklyBudgetPenalty);
  const budgetDelta = revenue - totalCost;

  return { storyRows, netCirc, netCred, revenue, totalCost, budgetDelta };
}

function publish() {
  const r = calcResults();
  S.results = r;
  S.circulation = Math.max(0, S.circulation + r.netCirc);
  S.credibility = clamp(S.credibility + r.netCred, 0, 100);
  S.budget += r.budgetDelta;

  S.history.unshift({ week:S.week, netCirc:r.netCirc, netCred:r.netCred, circ:S.circulation, cred:S.credibility, revenue:r.revenue, totalCost:r.totalCost, budgetDelta:r.budgetDelta, budget:S.budget });

  // Carry next-week bonus
  S.investBonus   = S.nextInvBonus > 1.0 ? S.nextInvBonus : 1.0;
  S.nextInvBonus  = 1.0;
  S.politicsBonus = 1.0;

  // Check early game over
  if (S.budget < -15000) {
    S.gameOverReason = 'The Gazette ran out of money. The presses fell silent.';
    S.grade = 'F'; S.won = false; S.phase = 'gameover'; return;
  }
  if (S.credibility < 15) {
    S.gameOverReason = 'Credibility collapsed. No sources will speak to you. No readers trust you.';
    S.grade = 'F'; S.won = false; S.phase = 'gameover'; return;
  }
  if (S.circulation < 18000) {
    S.gameOverReason = 'Readership collapsed. The Gazette could not sustain its print run.';
    S.grade = 'F'; S.won = false; S.phase = 'gameover'; return;
  }
  S.phase = 'results';
}

function endGame() {
  S.won = S.circulation >= 75000 && S.credibility >= 75;
  const c = S.circulation, r = S.credibility;
  if      (c >= 92000 && r >= 90) S.grade = 'A+';
  else if (c >= 80000 && r >= 85) S.grade = 'A';
  else if (c >= 75000 && r >= 75) S.grade = 'B';
  else if (c >= 65000 && r >= 65) S.grade = 'C';
  else if (c >= 45000 && r >= 40) S.grade = 'D';
  else                             S.grade = 'F';
  S.phase = 'gameover';
}

function nextWeek() {
  S.week += 1;
  S.reportersAvail = S.reportersBase;
  S.alloc = { local:0, politics:0, crime:0, investigative:0, features:0 };
  S.results = null; S.eventNote = null;
  const ev = pickEvent();
  S.usedEvIds.push(ev.id);
  S.curEvent = ev;
  S.phase = 'event';
}

// ═══════════════════════════════════════════
// EVENT HANDLERS (global for inline onclick)
// ═══════════════════════════════════════════

function startGame() {
  initState();
  const ev = pickEvent();
  S.usedEvIds.push(ev.id);
  S.curEvent = ev;
  S.phase = 'event';
  render();
}

function chooseEvent(i) {
  const choice = S.curEvent.choices[i];
  const note = applyEffect(choice.fx);
  S.eventNote = note || null;
  S.alloc = { local:0, politics:0, crime:0, investigative:0, features:0 };
  S.phase = 'allocation';
  render();
}

function changeAlloc(id, d) {
  const cat = CATS.find(c => c.id === id);
  const cur = S.alloc[id];
  const next = cur + d;
  if (next < 0 || next > cat.max) return;
  const total = Object.values(S.alloc).reduce((a,b)=>a+b,0);
  if (d > 0 && total >= S.reportersAvail) return;
  S.alloc[id] = next;
  renderMain(); renderSidebar();
}

function pressToPublish() {
  publish();
  render();
}

function goNextWeek() {
  nextWeek();
  render();
}

function goFinalise() {
  endGame();
  render();
}

function restartGame() {
  initState();
  render();
}

// ═══════════════════════════════════════════
// RENDER
// ═══════════════════════════════════════════

function render() { renderMasthead(); renderSidebar(); renderMain(); }

function getDateStr() {
  const d = new Date('1994-09-05');
  d.setDate(d.getDate() + (S.week - 1) * 7);
  return d.toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'});
}

function renderMasthead() {
  const el = document.getElementById('masthead');
  if (S.phase === 'intro') { el.innerHTML = ''; return; }
  const bc = S.budget < 30000 ? 'var(--red)' : 'var(--ink)';
  const cc = S.credibility < 30 ? 'var(--red)' : 'var(--ink)';
  const rc = S.circulation < 25000 ? 'var(--red)' : 'var(--ink)';
  el.innerHTML = `
    <div>
      <div class="paper-name">The Meridian Gazette</div>
      <div class="paper-tagline">Independent — Est. 1887 — Meridian, England</div>
    </div>
    <div class="masthead-stats">
      <div class="mstat"><span class="mstat-label">Circulation</span><span class="mstat-value" style="color:${rc}">${S.circulation.toLocaleString()}</span></div>
      <div class="mstat"><span class="mstat-label">Credibility</span><span class="mstat-value" style="color:${cc}">${S.credibility.toFixed(0)}/100</span></div>
      <div class="mstat"><span class="mstat-label">Budget</span><span class="mstat-value" style="color:${bc}">£${(S.budget/1000).toFixed(0)}k</span></div>
    </div>
    <div class="masthead-week">
      <div class="mw-label">Week</div>
      <div class="mw-num">${S.week} / ${WEEKS_TOTAL}</div>
      <div class="mw-date">${getDateStr()}</div>
    </div>`;
}

function renderSidebar() {
  const el = document.getElementById('sidebar');
  if (S.phase === 'intro') { el.innerHTML = ''; return; }

  const circPct = Math.min(100,(S.circulation/100000)*100);
  const credPct = Math.min(100, S.credibility);
  const budPct  = Math.min(100, Math.max(0,(S.budget/200000)*100));
  const circCol = S.circulation < 25000 ? 'var(--red)' : S.circulation < 45000 ? 'var(--amber)' : 'var(--blue)';
  const credCol = S.credibility < 30 ? 'var(--red)' : S.credibility < 55 ? 'var(--amber)' : 'var(--green)';
  const budCol  = S.budget < 30000 ? 'var(--red)' : S.budget < 80000 ? 'var(--amber)' : 'var(--green)';

  const cw = S.circulation >= 75000, rw = S.credibility >= 75, bw = S.budget > -15000;

  // Weekly finances preview (based on current state, before allocation)
  const weeklyRev    = Math.round(S.circulation * 0.38);
  const weeklyBase   = WEEKLY_BASE_COST + Math.round(S.weeklyBudgetPenalty);
  const weeklyNet    = weeklyRev - weeklyBase; // excludes reporter costs (unknown until alloc)
  const netCol       = weeklyNet >= 0 ? '#5caa74' : '#d05050';
  const weeksRunway  = weeklyNet < 0 && S.budget > 0 ? Math.floor(S.budget / Math.abs(weeklyNet)) : null;

  let histHtml = '';
  for (const h of S.history.slice(0,5)) {
    const cn  = h.netCirc >= 0 ? '#5caa74' : '#d05050';
    const rn  = h.netCred >= 0 ? '#5caa74' : '#d05050';
    const bn  = h.budgetDelta >= 0 ? '#5caa74' : '#d05050';
    histHtml += `<div class="hist-entry">
      <span class="hist-week">Week ${h.week}</span>
      Circ <strong style="color:var(--text)">${h.circ.toLocaleString()}</strong> <span style="color:${cn}">(${h.netCirc>=0?'+':''}${Math.round(h.netCirc).toLocaleString()})</span><br>
      Cred <strong style="color:var(--text)">${h.cred.toFixed(0)}</strong> <span style="color:${rn}">(${h.netCred>=0?'+':''}${h.netCred.toFixed(1)})</span><br>
      Rev <span style="color:#5caa74">+£${(h.revenue/1000).toFixed(1)}k</span> · Net <span style="color:${bn}">${h.budgetDelta>=0?'+':'−'}£${Math.abs(h.budgetDelta/1000).toFixed(1)}k</span>
    </div>`;
  }

  el.innerHTML = `
    <div class="sb-section">
      <div class="sb-heading">Performance</div>
      <div class="metric">
        <div class="metric-label">Circulation</div>
        <div class="metric-number">${S.circulation.toLocaleString()}</div>
        <div class="metric-bar"><div class="bar-fill" style="width:${circPct}%;background:${circCol}"></div></div>
      </div>
      <div class="metric">
        <div class="metric-label">Credibility</div>
        <div class="metric-number">${S.credibility.toFixed(1)}</div>
        <div class="metric-bar"><div class="bar-fill" style="width:${credPct}%;background:${credCol}"></div></div>
      </div>
      <div class="metric">
        <div class="metric-label">Budget</div>
        <div class="metric-number">£${(S.budget/1000).toFixed(0)}k</div>
        <div class="metric-bar"><div class="bar-fill" style="width:${budPct}%;background:${budCol}"></div></div>
      </div>
    </div>
    <div class="sb-section">
      <div class="sb-heading">Weekly Finances</div>
      <div style="font-family:'Oswald',sans-serif;font-size:0.65rem;line-height:2;color:var(--muted)">
        Revenue<span style="float:right;color:#5caa74">+£${(weeklyRev/1000).toFixed(1)}k</span><br>
        Base costs<span style="float:right;color:#d05050">−£${(weeklyBase/1000).toFixed(1)}k</span><br>
        <span style="font-size:0.58rem;color:var(--border)">────────────────</span><br>
        Pre-reporters<span style="float:right;color:${netCol}">${weeklyNet>=0?'+':'−'}£${Math.abs(weeklyNet/1000).toFixed(1)}k</span>
        ${weeksRunway !== null ? `<br><span style="font-size:0.6rem;color:var(--amber)">~${weeksRunway}w runway at current burn</span>` : ''}
      </div>
    </div>
    <div class="sb-section">
      <div class="sb-heading">Win Conditions</div>
      <div class="win-cond">
        Circulation ≥ 75,000<span class="tick ${cw?'tick-yes':'tick-no'}">${cw?'✓':'✗'}</span><br>
        Credibility ≥ 75<span class="tick ${rw?'tick-yes':'tick-no'}">${rw?'✓':'✗'}</span><br>
        Budget > −£15k<span class="tick ${bw?'tick-yes':'tick-no'}">${bw?'✓':'✗'}</span>
      </div>
    </div>
    ${S.history.length ? `<div class="sb-section"><div class="sb-heading">Recent Weeks</div>${histHtml}</div>` : ''}`;
}

function renderMain() {
  const el = document.getElementById('main');
  const map = { intro:rIntro, event:rEvent, allocation:rAlloc, results:rResults, gameover:rGameOver };
  el.innerHTML = (map[S.phase] || rIntro)();
}

function rIntro() {
  return `
    <div class="intro-title">The Meridian Gazette</div>
    <div class="intro-italic">Autumn, 1994 — Meridian, England</div>
    <hr class="intro-rule">
    <p class="intro-body">
      You've just been appointed Editor of the <em>Meridian Gazette</em>, a regional daily with a proud 107-year history and a precarious present. Circulation is softening. The Tribune is gaining. The budget is tighter than your predecessor let on.<br><br>
      Each week, a decision lands on your desk — an advertiser's ultimatum, a scoop opportunity, a legal threat. Then you deploy your reporters across story categories and send the issue to press.<br><br>
      You have <strong>ten weeks</strong> to build something worth keeping. You will be judged on your <strong>circulation</strong> (weekly readership) and your <strong>credibility</strong>.
    </p>
    <div class="intro-grid">
      <div class="intro-stat"><span class="ist-label">Starting Circulation</span><span class="ist-value">45,000</span></div>
      <div class="intro-stat"><span class="ist-label">Credibility</span><span class="ist-value">60 / 100</span></div>
      <div class="intro-stat"><span class="ist-label">Budget</span><span class="ist-value">£150k</span></div>
    </div>
    <div class="intro-rules">
      <strong>Win condition:</strong> reach 75,000+ circulation and 75+ credibility by end of Week 10.<br>
      <strong>Game over if:</strong> budget falls below −£15k, credibility drops under 15, or readership collapses below 18,000.<br>
      <strong>Your reporters:</strong> 8 available each week. Assign them across five story categories.
    </div>
    <button class="btn-primary" onclick="startGame()">Take the Chair</button>`;
}

function rEvent() {
  const ev = S.curEvent;
  const opts = ev.choices.map((c,i)=>`
    <button class="choice-btn" onclick="chooseEvent(${i})">
      <span class="choice-letter">Option ${String.fromCharCode(65+i)}</span>
      <strong>${c.label}</strong> — ${c.desc}
      <div class="choice-fx">${c.fxt}</div>
    </button>`).join('');
  return `
    <div class="phase-tag"><span class="phase-dot"></span>Week ${S.week} — Breaking</div>
    <div class="phase-headline">Editor's Desk</div>
    <div class="event-card">
      <div class="event-headline">${ev.headline}</div>
      <div class="event-body">${ev.body}</div>
      <div class="choices">${opts}</div>
    </div>`;
}

function rAlloc() {
  const total = Object.values(S.alloc).reduce((a,b)=>a+b,0);
  const rem = S.reportersAvail - total;

  const noteHtml = S.eventNote ? `
    <div class="note-bar event-note">
      <span class="note-label" style="color:var(--red)">Event Result</span>
      ${S.eventNote}
    </div>` : '';

  const mods = [];
  if (S.investBonus > 1.0)       mods.push(`Investigative ×${S.investBonus.toFixed(1)} this week`);
  if (S.politicsBonus > 1.0)     mods.push(`City Politics ×${S.politicsBonus.toFixed(1)} this week`);
  if (S.investMultiplier < 1.0)  mods.push(`Investigative ×${S.investMultiplier.toFixed(2)} permanent`);
  if (S.investMultiplier > 1.0 && S.investMultiplier !== S.investBonus) mods.push(`Investigative ×${S.investMultiplier.toFixed(2)} permanent`);
  const modHtml = mods.length ? `
    <div class="note-bar" style="border-color:var(--purple)">
      <span class="note-label" style="color:var(--purple)">Active Modifiers</span>
      ${mods.join(' · ')}
    </div>` : '';

  const rows = CATS.map(cat => {
    const n = S.alloc[cat.id];
    const cost = n * cat.cost;
    const canInc = n < cat.max && rem > 0;
    const canDec = n > 0;
    const credSign = cat.cred >= 0 ? '+' : '';
    const credCls  = cat.cred >= 0 ? 'pos' : 'neg';
    return `
      <div class="alloc-row ${n > 0 ? 'active' : ''}">
        <div>
          <div class="cat-name">${cat.name}</div>
          <div class="cat-meta">${cat.desc} &nbsp;·&nbsp; +${cat.circ}/rep circ &nbsp;·&nbsp; <span class="${credCls}">${credSign}${cat.cred}/rep cred</span> &nbsp;·&nbsp; max ${cat.max}</div>
        </div>
        <div class="rctrl">
          <div class="cat-cost">${cost > 0 ? '£'+(cost/1000).toFixed(1)+'k' : '—'}</div>
          <div class="cbtn ${canDec?'':'disabled'}" onclick="${canDec?`changeAlloc('${cat.id}',-1)`:''}">−</div>
          <div class="cval">${n}</div>
          <div class="cbtn ${canInc?'':'disabled'}" onclick="${canInc?`changeAlloc('${cat.id}',1)`:''}">+</div>
        </div>
      </div>`;
  }).join('');

  const repCost = CATS.reduce((s,c)=>s+c.cost*S.alloc[c.id],0);
  const totCost = WEEKLY_BASE_COST + repCost + Math.round(S.weeklyBudgetPenalty);
  const rev = Math.round(S.circulation * 0.38);
  const net = rev - totCost;
  const netCol = net >= 0 ? 'var(--green)' : 'var(--red)';

  return `
    <div class="phase-tag"><span class="phase-dot"></span>Week ${S.week} — Allocation</div>
    <div class="phase-headline">Assign Your Reporters</div>
    ${noteHtml}${modHtml}
    <div class="alloc-hint"><strong>${rem}</strong> of ${S.reportersAvail} reporters unassigned</div>
    <div class="alloc-rows">${rows}</div>
    <div class="cost-preview">
      Revenue: <span style="color:var(--green)">+£${(rev/1000).toFixed(0)}k</span> &nbsp;·&nbsp;
      Costs: <span style="color:var(--red)">−£${(totCost/1000).toFixed(0)}k</span> (base £${(WEEKLY_BASE_COST/1000).toFixed(0)}k + reporters £${(repCost/1000).toFixed(1)}k${S.weeklyBudgetPenalty>0?` + ongoing £${(S.weeklyBudgetPenalty/1000).toFixed(1)}k`:''}) &nbsp;·&nbsp;
      Net: <span style="color:${netCol}">${net>=0?'+':'−'}£${Math.abs(net/1000).toFixed(0)}k</span>
    </div>
    <button class="btn-primary" onclick="pressToPublish()">Press to Print</button>`;
}

function rResults() {
  const r = S.results;
  const storyHtml = r.storyRows.map((s,i)=>{
    const cc = s.circG > 0 ? '#5caa74' : '#d05050';
    const rc = s.credG > 0 ? '#5caa74' : '#d05050';
    return `<div class="res-row" style="animation-delay:${i*.07}s">
      <div>
        <span style="font-family:'Playfair Display',serif;font-weight:700;color:var(--paper)">${s.name}</span>
        <span style="color:var(--muted);margin-left:8px">${s.n} reporter${s.n>1?'s':''}</span>
      </div>
      <div style="display:flex;gap:14px">
        <span class="res-delta" style="color:${cc}">${s.circG>0?'+':''}${s.circG.toLocaleString()}</span>
        <span class="res-delta" style="color:${rc}">${s.credG>0?'+':''}${s.credG.toFixed(1)}</span>
      </div>
    </div>`;
  }).join('');

  const d1 = r.storyRows.length;
  const d2 = d1 + 1;
  const nc = r.netCirc >= 0 ? '#5caa74' : '#d05050';
  const nr = r.netCred >= 0 ? '#5caa74' : '#d05050';
  const nb = r.budgetDelta >= 0 ? '#5caa74' : '#d05050';

  const isLast = S.week >= WEEKS_TOTAL;
  const nextBtn = isLast
    ? `<button class="btn-primary" onclick="goFinalise()">Final Edition →</button>`
    : `<button class="btn-primary" onclick="goNextWeek()">Next Week →</button>`;

  return `
    <div class="phase-tag"><span class="phase-dot"></span>Week ${S.week} — Results</div>
    <div class="phase-headline">Issue Published</div>
    <div class="results-list">
      ${storyHtml}
      <div class="res-row churn-row" style="animation-delay:${d1*.07}s">
        <span style="color:var(--muted)">Weekly churn &amp; drift</span>
        <div style="display:flex;gap:14px">
          <span class="res-delta" style="color:#d05050">−${WEEKLY_CHURN.toLocaleString()}</span>
          <span class="res-delta" style="color:#d05050">−${(WEEKLY_CRED_DRIFT+S.weeklyCredPenalty).toFixed(1)}</span>
        </div>
      </div>
      <div class="res-row budget-row" style="animation-delay:${d1*.07}s">
        <span style="color:var(--muted)">Circulation revenue</span>
        <span class="res-delta" style="color:#5caa74">+£${(r.revenue/1000).toFixed(1)}k</span>
      </div>
      <div class="res-row budget-row" style="animation-delay:${d2*.07}s">
        <span style="color:var(--muted)">Operating costs</span>
        <span class="res-delta" style="color:#d05050">−£${(r.totalCost/1000).toFixed(1)}k</span>
      </div>
      <div class="res-row budget-row" style="animation-delay:${(d2+1)*.07}s;border-top:1px solid var(--border)">
        <span style="color:var(--text);font-family:'Oswald',sans-serif;font-size:0.72rem;letter-spacing:1px;text-transform:uppercase">Net to budget</span>
        <span class="res-delta" style="color:${nb}">${r.budgetDelta>=0?'+':'−'}£${Math.abs(r.budgetDelta/1000).toFixed(1)}k</span>
      </div>
    </div>
    <div class="res-summary">
      Net this week:
      <strong style="color:${nc}">${r.netCirc>=0?'↑':'↓'} ${Math.abs(r.netCirc).toLocaleString()} circulation</strong>
      &nbsp;·&nbsp;
      <strong style="color:${nr}">${r.netCred>=0?'↑':'↓'} ${Math.abs(r.netCred).toFixed(1)} credibility</strong><br>
      Standing: <strong>${S.circulation.toLocaleString()}</strong> readers &nbsp;·&nbsp; credibility <strong>${S.credibility.toFixed(1)}</strong> &nbsp;·&nbsp; budget <strong>£${(S.budget/1000).toFixed(0)}k</strong>
    </div>
    ${nextBtn}`;
}

function rGameOver() {
  const gradeColors = { 'A+':'#ffd040', A:'#c9a03e', B:'#5caa74', C:'#3568a0', D:'#7a6e5e', F:'#bf1228' };
  const gc = gradeColors[S.grade] || 'var(--gold)';

  const narratives = {
    'A+': 'The Meridian Gazette is the gold standard of regional journalism. Your tenure will be studied.',
    'A':  'You built something remarkable. The Gazette is healthy, credible, and trusted. A genuine success.',
    'B':  'You met your targets. The paper is stronger than when you found it. Real foundations laid.',
    'C':  'You missed the targets. The Gazette survives. Not a triumph, but not a complete failure.',
    'D':  'You barely kept the lights on. The paper is weaker than when you started, but it is still printing, just about.',
    'F':  S.gameOverReason || 'The Gazette did not survive your editorship.',
  };

  const headline = S.grade === 'F' ? 'The Presses Fall Silent' : (S.won ? 'Final Edition' : 'Tenure Complete');
  const subWeek = S.grade === 'F' ? `Ended Week ${S.week}` : `10 Weeks Complete`;

  return `
    <div class="go-wrap">
      <div class="go-banner">${subWeek} — Editor's Verdict</div>
      <div class="go-headline">${headline}</div>
      <div class="go-sub">${narratives[S.grade] || ''}</div>
      <div class="grade-big" style="color:${gc}">${S.grade}</div>
      <div class="go-stats">
        <div class="go-stat">
          <div class="go-stat-label">Final Circulation</div>
          <span class="go-stat-value">${S.circulation.toLocaleString()}</span>
        </div>
        <div class="go-stat">
          <div class="go-stat-label">Final Credibility</div>
          <span class="go-stat-value">${S.credibility.toFixed(0)}</span>
        </div>
        <div class="go-stat">
          <div class="go-stat-label">Budget Remaining</div>
          <span class="go-stat-value" style="color:${S.budget<0?'var(--red)':'var(--gold)'}">£${(S.budget/1000).toFixed(0)}k</span>
        </div>
      </div>
      <button class="btn-secondary" onclick="restartGame()">New Editorship</button>
    </div>`;
}

// ── BOOT ──
initState();
render();
</script>
</body>
</html>
